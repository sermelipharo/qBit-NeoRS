name: Release

# Pushing a tag vX.Y.Z builds the ad-hoc signed app and attaches it to a draft
# release for that tag; the release is published by hand after review.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build and draft the release
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/setup-rust.sh
      # The dependencies' release builds, so a release recompiles only our crates.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/scripts/setup-rust.sh') }}
          restore-keys: release-
      - name: Tools
        run: brew install xcodegen
      - name: Tag matches the app version
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apps/macos/project.yml | sort -u)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match MARKETING_VERSION $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: |
          # No build machine paths in the binary.
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo/registry/src=/cargo --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          scripts/build-core.sh release
          cd apps/macos
          xcodegen generate
          xcodebuild build -project QBTNeo.xcodeproj -scheme QBTNeo -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO -quiet
          # Ad-hoc code may only load Sparkle.framework without library validation.
          ../../scripts/adhoc-sign.sh "$RUNNER_TEMP/dd/Build/Products/Release/qBit NeoRS.app"
      - name: Check the bundle
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release/qBit NeoRS.app"
          test "$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)" = "$VERSION"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q '^Signature=adhoc$'
          # Only the demo mode's made-up paths may name a home folder.
          if find "$APP" -type f -print0 | xargs -0 strings -a | grep -E '/Users/|/home/runner|/private/var/folders/' | grep -v '^/Users/demo/' | sort -u | head -20 | grep .; then
            echo "::error::build machine paths in the bundle"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Package
        run: |
          ZIP="qBit-NeoRS-$VERSION-arm64.zip"
          mkdir -p "$RUNNER_TEMP/out"
          cd "$(dirname "$APP")"
          ditto -c -k --keepParent "qBit NeoRS.app" "$RUNNER_TEMP/out/$ZIP"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"
      - name: Draft the release
        run: |
          cd "$RUNNER_TEMP/out"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "qBit NeoRS $VERSION" --notes "Release notes to follow." ./*
          fi
