[workspace]
resolver = "3"
members = [
    "engine/librqbit",
    "engine/buffers",
    "engine/clone_to_owned",
    "engine/bencode",
    "engine/sha1w",
    "engine/librqbit_core",
    "engine/librqbit_lsd",
    "engine/peer_binary_protocol",
    "engine/dht",
    "engine/upnp",
    "engine/tracker_comms",
    "engine/mse",
    "engine/webseed",
    "engine/natpmp",
    "engine/proxy",
    "engine/i2p",
    "crates/qbt-core",
    "crates/qbt-ffi",
    "crates/qbt-nox",
    "crates/qbt-e2e",
]

[workspace.package]
# Engine crates keep the upstream librqbit version they were forked from.
version = "9.0.1"

[profile.dev]
panic = "abort"
# Disk space matters on this machine: keep only line tables for our crates
# and no debug info for dependencies.
debug = "line-tables-only"
# Keep dependencies optimized even in debug builds: hashing and the
# peer protocol are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
debug = false
# RC4 (protocol encryption) runs over every payload byte.
[profile.dev.package.librqbit-mse]
opt-level = 2

[profile.release]
panic = "abort"
debug = false
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[workspace.dependencies]
uniffi = "0.32"
# Internal crates - keys are import names used in source code, package is the actual crate name
librqbit = { path = "engine/librqbit", version = "9.0.1", default-features = false }
bencode = { path = "engine/bencode", package = "librqbit-bencode", version = "9.0.1", default-features = false }
buffers = { path = "engine/buffers", package = "librqbit-buffers", version = "9.0.1" }
clone_to_owned = { path = "engine/clone_to_owned", package = "librqbit-clone-to-owned", version = "9.0.1" }
librqbit-core = { path = "engine/librqbit_core", version = "9.0.1", default-features = false }
dht = { path = "engine/dht", package = "librqbit-dht", version = "9.0.1", default-features = false }
librqbit-lsd = { path = "engine/librqbit_lsd", version = "9.0.1", default-features = false }
peer_binary_protocol = { path = "engine/peer_binary_protocol", package = "librqbit-peer-protocol", version = "9.0.1", default-features = false }
sha1w = { path = "engine/sha1w", package = "librqbit-sha1-wrapper", version = "9.0.1", default-features = false }
tracker_comms = { path = "engine/tracker_comms", package = "librqbit-tracker-comms", version = "9.0.1", default-features = false }
librqbit-mse = { path = "engine/mse", version = "9.0.1" }
librqbit-webseed = { path = "engine/webseed", version = "9.0.1" }
librqbit-natpmp = { path = "engine/natpmp", version = "9.0.1" }
librqbit-proxy = { path = "engine/proxy", version = "9.0.1" }
librqbit-i2p = { path = "engine/i2p", version = "9.0.1" }
librqbit-upnp = { path = "engine/upnp", version = "9.0.1" }

# External crates
